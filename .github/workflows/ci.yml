name: CI Load Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  load-test:
    name: load-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Installed dependenciesat runtime for this workflow.
          # For production use, dependencies should be baked into the base image.
          # Updates are handled via the build-image workflow triggered by PR labels.
          # Will discuss in second round
          
          # Install kubectl (using fixed version for reliability)
          curl -LO https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Install KinD (updated version)
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/

          # Install Helm (updated version)
          curl https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz -o helm.tar.gz
          tar -zxvf helm.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm

          # Install hey for load testing
          wget https://hey-release.s3.us-east-2.amazonaws.com/hey_linux_amd64
          chmod +x hey_linux_amd64
          sudo mv hey_linux_amd64 /usr/local/bin/hey

      - name: Create KinD cluster
        run: |
          chmod +x scripts/create-kind-cluster.sh
          ./scripts/create-kind-cluster.sh

      - name: Deploy services
        run: |
          chmod +x scripts/deploy-services.sh
          ./scripts/deploy-services.sh

      - name: Wait for readiness
        run: |
          chmod +x scripts/wait-for-readiness.sh
          ./scripts/wait-for-readiness.sh

      - name: Run load test
        run: |
          chmod +x scripts/run-load-test.sh
          ./scripts/run-load-test.sh

      - name: Generate Summary
        run: |
          # Generates a basic workflow summary.
          # In a real project, this can be enhanced to include error details so users
          # can quickly identify failures without inspecting individual step logs.
          # Will discuss in second round
          chmod +x scripts/generate-summary.sh
          ./scripts/generate-summary.sh

          
          # Posts the workflow results as a comment on the pull request
          # using a GitHub-approved Marketplace action.
          # In a real project , will use a ReleasePlease for tag generation instead of comment on PR.
          # Will discuss in second round
      - name: Post results to PR
        uses: peter-evans/create-or-update-comment@v3
        if: github.event_name == 'pull_request'
        with:
          issue-number: ${{ github.event.number }}
          body-path: results.md
          token: ${{ secrets.GITHUB_TOKEN }}
