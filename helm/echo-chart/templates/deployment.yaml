{{- range $serviceName, $service := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}-deployment
spec:
  replicas: {{ $service.replicas }}
  selector:
    matchLabels:
      app: {{ $serviceName }}
  template:
    metadata:
      labels:
        app: {{ $serviceName }}
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo
        args:
        - "-text={{ $service.text }}"
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}-service
spec:
  selector:
    app: {{ $serviceName }}
  ports:
  - port: 80
    targetPort: 5678
---
{{- end }}